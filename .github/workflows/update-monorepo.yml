name: Update monorepo submodule pointer

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bump-submodule:
    runs-on: ubuntu-latest
    concurrency:
      group: monorepo-submodule-update
      cancel-in-progress: false
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.PRONTO_MONOREPO_APP_CLIENT_ID }}
          private-key: ${{ secrets.PRONTO_MONOREPO_APP_PRIVATE_KEY }}
          owner: prontocx
          repositories: transit

      # The commit is created through the Git Data API instead of git push so GitHub signs it
      # as the app; a gitlink (mode 160000) cannot be set with createCommitOnBranch.
      - name: Bump transit-web-components pointer in the monorepo
        env:
          MONOREPO: prontocx/transit
          SUBMODULE: transit-web-components
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Read the branch tip, not github.sha, so a re-run of an old push never moves the pointer back.
          target=$(GH_TOKEN="$GITHUB_TOKEN" gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          export GH_TOKEN="$APP_TOKEN"

          # The other repos bump the same monorepo, so a non-fast-forward ref update is retried from the new head.
          for attempt in 1 2 3 4 5; do
            head=$(gh api "repos/$MONOREPO/git/ref/heads/main" --jq .object.sha)
            current=$(gh api "repos/$MONOREPO/contents/$SUBMODULE?ref=$head" --jq .sha)
            if [ "$current" = "$target" ]; then
              echo "No pointer change needed."
              exit 0
            fi

            base_tree=$(gh api "repos/$MONOREPO/git/commits/$head" --jq .tree.sha)
            tree=$(jq -n --arg base "$base_tree" --arg path "$SUBMODULE" --arg sha "$target" \
              '{base_tree: $base, tree: [{path: $path, mode: "160000", type: "commit", sha: $sha}]}' \
              | gh api "repos/$MONOREPO/git/trees" --input - --jq .sha)
            commit=$(jq -n --arg msg "chore: bump $SUBMODULE to ${target:0:8}" --arg tree "$tree" --arg parent "$head" \
              '{message: $msg, tree: $tree, parents: [$parent]}' \
              | gh api "repos/$MONOREPO/git/commits" --input - --jq .sha)

            if jq -n --arg sha "$commit" '{sha: $sha, force: false}' \
              | gh api -X PATCH "repos/$MONOREPO/git/refs/heads/main" --input - --silent; then
              echo "Bumped $SUBMODULE to $target in $MONOREPO ($commit)."
              exit 0
            fi

            echo "Ref update rejected, retrying ($attempt/5)..."
            sleep $((attempt * 2))
          done

          echo "Bump failed after 5 attempts" >&2
          exit 1
